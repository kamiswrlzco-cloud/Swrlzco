name: SWRLZ Source Package Integrity

on:
  push:
    branches: [main]
    paths:
      - 'swrlz-core/sources/client/*.zip'
      - 'swrlz-core/sources/client/*.sha256'
      - 'swrlz-core/sources/client/*.sha'
      - 'swrlz-core/sources/client/*.txt'
      - 'swrlz-core/sources/client/*.manifest.json'
      - 'swrlz-core/sources/server/*.zip'
      - 'swrlz-core/sources/server/*.sha256'
      - 'swrlz-core/sources/server/*.sha'
      - 'swrlz-core/sources/server/*.txt'
      - 'swrlz-core/sources/server/*.manifest.json'

  workflow_dispatch:
    inputs:
      source_zip:
        description: Repository-relative lane-root source ZIP under swrlz-core/sources/client or server
        required: true
        type: string

permissions:
  contents: read

env:
  SWRLZ_SOURCE_ROOT: swrlz-core/sources
  SWRLZ_VERIFY_TOOL: swrlz-core/tools/ci/verify_swrlz_package_pair.py

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Resolve changed or selected source packages
        id: sources
        shell: bash
        run: |
          set -euo pipefail
          list="$RUNNER_TEMP/swrlz-zips.txt"
          : > "$list"

          add_source_zip() {
            local candidate="$1"
            case "$candidate" in
              swrlz-core/sources/client/*.zip|swrlz-core/sources/server/*.zip) ;;
              *) echo "Refusing non-lane-root source candidate: $candidate" >&2; exit 64 ;;
            esac
            if [[ "$candidate" == */.transport/* || "$candidate" == */*/*/*/*.zip ]]; then
              echo "Refusing nested transport/evidence ZIP candidate: $candidate" >&2
              exit 64
            fi
            [[ -f "$candidate" ]] || {
              echo "Source sidecar selected a missing lane-root ZIP: $candidate" >&2
              exit 66
            }
            printf '%s\n' "$candidate" >> "$list"
          }

          if [[ "${{ github.event_name }}" == 'workflow_dispatch' ]]; then
            source='${{ inputs.source_zip }}'
            if [[ ! "$source" =~ ^swrlz-core/sources/(client|server)/[^/]+\.zip$ ]]; then
              echo "source_zip must point to a lane-root CLIENT or SERVER source ZIP: $source" >&2
              exit 64
            fi
            add_source_zip "$source"
          else
            BEFORE='${{ github.event.before }}'
            AFTER='${{ github.sha }}'
            changed="$RUNNER_TEMP/swrlz-changed.txt"

            if [[ -z "$BEFORE" || "$BEFORE" =~ ^0+$ ]]; then
              git show --pretty= --name-only "$AFTER" > "$changed"
            else
              git diff --name-only "$BEFORE" "$AFTER" > "$changed"
            fi

            while IFS= read -r path; do
              [[ -n "$path" ]] || continue

              # Only lane-root source identities/evidence are eligible here. Forge
              # transport chunks and their nested evidence live below .transport/
              # and are verified by the APK Router resolver during reconstruction.
              if [[ ! "$path" =~ ^swrlz-core/sources/(client|server)/[^/]+$ ]]; then
                continue
              fi

              candidate=''
              case "$path" in
                *.zip)
                  candidate="$path"
                  ;;
                *.sha256.txt)
                  candidate="${path%.sha256.txt}.zip"
                  ;;
                *.sha256)
                  candidate="${path%.sha256}.zip"
                  ;;
                *.sha)
                  candidate="${path%.sha}.zip"
                  ;;
                *.manifest.json)
                  candidate="${path%.manifest.json}.zip"
                  ;;
                *.txt)
                  candidate="${path%.txt}.zip"
                  ;;
              esac

              [[ -n "$candidate" ]] || continue
              add_source_zip "$candidate"
            done < "$changed"
          fi

          sort -u -o "$list" "$list"
          cat "$list"
          echo "list=$list" >> "$GITHUB_OUTPUT"

      - name: Verify final ZIP checksum and optional manifest
        shell: bash
        run: |
          set -euo pipefail
          list='${{ steps.sources.outputs.list }}'
          [[ -s "$list" ]] || { echo 'No lane-root source packages selected.'; exit 0; }

          while IFS= read -r zip; do
            [[ -n "$zip" ]] || continue
            python3 "$SWRLZ_VERIFY_TOOL" "$zip"
          done < "$list"
