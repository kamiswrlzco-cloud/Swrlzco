name: SWRLZ Phase 5E Real Benchmark

on:
  pull_request:
    branches:
      - checkpoint/forge-phase5e-benchmark-20260821
    paths:
      - 'swrlz-core/tools/ci/.phase5e-benchmark-trigger.txt'
      - '.github/workflows/phase5e-real-benchmark.yml'

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  PRODUCTION_SHA: f9c7ae40acb426eeabff24b530a21ffe5a60f110
  SWRLZ_CI_ROOT: swrlz-core/tools/ci

jobs:
  tooling:
    name: Production tooling suite
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact Phase 5E production tree
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: f9c7ae40acb426eeabff24b530a21ffe5a60f110
          fetch-depth: 2
          filter: blob:none
          persist-credentials: false
          sparse-checkout: |
            .github/workflows
            swrlz-core/tools/ci
            swrlz-core/requests
            swrlz-core/history

      - name: Validate complete production CI tooling
        working-directory: swrlz-core/tools/ci
        run: |
          set -euo pipefail
          python3 -m py_compile \
            resolve_swrlz_source.py \
            resolve_changed_source_identities.py \
            resolve_push_changed_paths.py \
            resolve_swrlz_latest_identity.py \
            plan_swrlz_build_route.py \
            plan_swrlz_candidate_checkout.py \
            plan_swrlz_integrity_route.py \
            prepare_swrlz_sparse_checkout.py \
            verify_swrlz_package_pair.py \
            verify_patch_note_accounting.py \
            test_resolve_swrlz_source.py \
            test_resolve_changed_source_identities.py \
            test_resolve_push_changed_paths.py \
            test_resolve_swrlz_latest_identity.py \
            test_plan_swrlz_build_route.py \
            test_plan_swrlz_candidate_checkout.py \
            test_plan_swrlz_integrity_route.py \
            test_prepare_swrlz_sparse_checkout.py \
            test_verify_swrlz_package_pair.py \
            test_verify_patch_note_accounting.py \
            test_build_swrlz_component.py \
            test_workflow_phase5_contract.py
          bash -n build_swrlz_component.sh
          python3 test_resolve_swrlz_source.py
          python3 test_resolve_changed_source_identities.py
          python3 test_resolve_push_changed_paths.py
          python3 test_resolve_swrlz_latest_identity.py
          python3 test_plan_swrlz_build_route.py
          python3 test_plan_swrlz_candidate_checkout.py
          python3 test_plan_swrlz_integrity_route.py
          python3 test_prepare_swrlz_sparse_checkout.py
          python3 test_verify_swrlz_package_pair.py
          python3 test_verify_patch_note_accounting.py
          python3 test_build_swrlz_component.py
          python3 test_workflow_phase5_contract.py

      - name: Validate pinned runner toolchain policy
        run: |
          set -euo pipefail
          JDK_DIR="${JAVA_HOME_17_X64:-}"
          [[ -n "$JDK_DIR" && -x "$JDK_DIR/bin/java" && -x "$JDK_DIR/bin/javac" && -x "$JDK_DIR/bin/keytool" ]]
          [[ "$("$JDK_DIR/bin/java" -XshowSettings:properties -version 2>&1 | awk -F'= ' '/java.specification.version/{print $2; exit}')" == '17' ]]
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          [[ -n "$SDK_DIR" && -d "$SDK_DIR" ]]
          [[ -x "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" ]]
          APKSIGNER="$(find "$SDK_DIR/build-tools" -mindepth 2 -maxdepth 2 -type f -name apksigner -print 2>/dev/null | sort -V | tail -n 1)"
          ZIPALIGN="$(find "$SDK_DIR/build-tools" -mindepth 2 -maxdepth 2 -type f -name zipalign -print 2>/dev/null | sort -V | tail -n 1)"
          [[ -x "$APKSIGNER" && -x "$ZIPALIGN" ]]

  prepare:
    name: Resolve exact latest candidates
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Checkout exact Phase 5E route tooling
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: f9c7ae40acb426eeabff24b530a21ffe5a60f110
          fetch-depth: 2
          filter: blob:none
          persist-credentials: false
          sparse-checkout: |
            swrlz-core/tools/ci
            swrlz-core/requests

      - name: Resolve blank routes into exact current identities
        id: plan
        run: |
          set -euo pipefail
          MATRIX='{"include":[{"component":"CLIENT","source_identity":""},{"component":"SERVER","source_identity":""}]}'
          python3 "$SWRLZ_CI_ROOT/plan_swrlz_candidate_checkout.py" \
            --matrix-json "$MATRIX" \
            --ref "$PRODUCTION_SHA" \
            --github-output "$GITHUB_OUTPUT"
          python3 - <<'PY'
          import json, os
          matrix = json.loads(open(os.environ['GITHUB_OUTPUT'], encoding='utf-8').read().split('matrix=', 1)[1].splitlines()[0])
          rows = matrix['include']
          assert len(rows) == 2, rows
          assert {row['component'] for row in rows} == {'CLIENT', 'SERVER'}
          for row in rows:
              assert row['checkout_mode'] == 'exact-latest-candidate', row
              assert row['source_identity'], row
              assert row['source_size_bytes'] > 0, row
              assert 'full-lane' not in row['checkout_mode'], row
              print(row['component'], row['source_identity'], row['source_size_label'], row['source_chunk_count'])
          PY

  real-build:
    name: ${{ matrix.component }} · exact-latest + config-cache reuse
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - name: Start exact hydration timer
        run: echo "BENCH_HYDRATE_START=$(date +%s%3N)" >> "$GITHUB_ENV"

      - name: Hydrate exact ${{ matrix.component }} candidate · ${{ matrix.source_size_label }}
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: f9c7ae40acb426eeabff24b530a21ffe5a60f110
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: ${{ matrix.checkout_patterns }}

      - name: Record hydration and verify exact mode
        id: hydration
        run: |
          set -euo pipefail
          ELAPSED=$(($(date +%s%3N) - BENCH_HYDRATE_START))
          echo "ms=$ELAPSED" >> "$GITHUB_OUTPUT"
          [[ '${{ matrix.checkout_mode }}' == 'exact-latest-candidate' ]]
          [[ -n '${{ matrix.source_identity }}' ]]
          echo "${{ matrix.component }} exact hydration: ${ELAPSED} ms · ${{ matrix.source_size_label }} · ${{ matrix.source_chunk_count }} chunks" >> "$GITHUB_STEP_SUMMARY"

      - name: Resolve and verify current source package
        id: source
        env:
          COMPONENT: ${{ matrix.component }}
          SOURCE_IDENTITY: ${{ matrix.source_identity }}
        run: |
          set -euo pipefail
          python3 "$SWRLZ_CI_ROOT/resolve_swrlz_source.py" \
            --component "$COMPONENT" \
            --source-zip "$SOURCE_IDENTITY" \
            --work-dir "$RUNNER_TEMP/phase5e-benchmark/source/$COMPONENT" \
            --github-output "$GITHUB_OUTPUT"
          args=("$(grep '^selected_source=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2-)")
          CHECKSUM="$(grep '^checksum_file=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2-)"
          MANIFEST="$(grep '^manifest_file=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2-)"
          [[ -n "$CHECKSUM" ]] && args+=(--checksum "$CHECKSUM")
          [[ -n "$MANIFEST" ]] && args+=(--manifest "$MANIFEST")
          python3 "$SWRLZ_CI_ROOT/verify_swrlz_package_pair.py" "${args[@]}"

      - name: Validate preinstalled Java 17
        id: java
        run: |
          set -euo pipefail
          START=$(date +%s%3N)
          JDK_DIR="${JAVA_HOME_17_X64:-}"
          [[ -n "$JDK_DIR" && -x "$JDK_DIR/bin/java" && -x "$JDK_DIR/bin/javac" && -x "$JDK_DIR/bin/keytool" ]]
          [[ "$("$JDK_DIR/bin/java" -XshowSettings:properties -version 2>&1 | awk -F'= ' '/java.specification.version/{print $2; exit}')" == '17' ]]
          echo "JAVA_HOME=$JDK_DIR" >> "$GITHUB_ENV"
          echo "$JDK_DIR/bin" >> "$GITHUB_PATH"
          echo "ms=$(($(date +%s%3N) - START))" >> "$GITHUB_OUTPUT"

      - name: Set up open-source Gradle cache
        id: gradle-setup
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic
          cache-read-only: true
          cache-cleanup: on-success

      - name: Validate preinstalled Android SDK fast path
        id: android
        run: |
          set -euo pipefail
          START=$(date +%s%3N)
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          [[ -n "$SDK_DIR" && -d "$SDK_DIR" ]]
          SDKMANAGER="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
          APKSIGNER="$(find "$SDK_DIR/build-tools" -mindepth 2 -maxdepth 2 -type f -name apksigner -print 2>/dev/null | sort -V | tail -n 1)"
          ZIPALIGN="$(find "$SDK_DIR/build-tools" -mindepth 2 -maxdepth 2 -type f -name zipalign -print 2>/dev/null | sort -V | tail -n 1)"
          [[ -x "$SDKMANAGER" && -x "$APKSIGNER" && -x "$ZIPALIGN" ]]
          echo "ms=$(($(date +%s%3N) - START))" >> "$GITHUB_OUTPUT"

      - name: First real build with configuration cache enabled
        id: build1
        env:
          SWRLZ_VERIFIED_SOURCE_SHA256: ${{ steps.source.outputs.source_sha256 }}
          SWRLZ_SOURCE_HYDRATION_MS: ${{ steps.hydration.outputs.ms }}
          SWRLZ_JAVA_SETUP_MS: ${{ steps.java.outputs.ms }}
          SWRLZ_GRADLE_SETUP_MS: '0'
          SWRLZ_ANDROID_SDK_SETUP_MS: ${{ steps.android.outputs.ms }}
          SWRLZ_GRADLE_CONFIGURATION_CACHE: 'true'
        run: |
          set -euo pipefail
          bash "$SWRLZ_CI_ROOT/build_swrlz_component.sh" \
            '${{ matrix.component }}' \
            '${{ steps.source.outputs.selected_source }}' \
            '${{ steps.source.outputs.canonical_stem }}' \
            debug \
            "$RUNNER_TEMP/phase5e-benchmark/build/${{ matrix.component }}" \
            "$RUNNER_TEMP/phase5e-benchmark/artifacts/${{ matrix.component }}"

      - name: Second build must reuse configuration cache
        id: build2
        env:
          PROJECT_ROOT: ${{ steps.build1.outputs.project_root }}
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/phase5e-benchmark/${{ matrix.component }}-config-cache-reuse.log"
          START=$(date +%s%3N)
          (
            cd "$PROJECT_ROOT"
            ./gradlew \
              --no-daemon \
              --stacktrace \
              --build-cache \
              --parallel \
              --no-watch-fs \
              --configuration-cache \
              :app:assembleDebug
          ) 2>&1 | tee "$LOG"
          ELAPSED=$(($(date +%s%3N) - START))
          echo "ms=$ELAPSED" >> "$GITHUB_OUTPUT"
          grep -Eq 'Reusing configuration cache|Configuration cache entry reused' "$LOG"

      - name: Publish benchmark result
        if: always()
        run: |
          {
            echo '## Phase 5E real benchmark'
            echo
            echo '- Production SHA: `${{ env.PRODUCTION_SHA }}`'
            echo '- Component: `${{ matrix.component }}`'
            echo '- Exact identity: `${{ matrix.source_identity }}`'
            echo '- Checkout mode: `${{ matrix.checkout_mode }}`'
            echo '- Source payload: `${{ matrix.source_size_label }}`'
            echo '- Transport chunks: `${{ matrix.source_chunk_count }}`'
            echo '- Exact hydration: `${{ steps.hydration.outputs.ms || 'NA' }} ms`'
            echo '- Java fast path: `${{ steps.java.outputs.ms || 'NA' }} ms`'
            echo '- Android SDK fast path: `${{ steps.android.outputs.ms || 'NA' }} ms`'
            echo '- First config-cache build: `${{ steps.build1.outputs.gradle_ms || 'NA' }} ms`'
            echo '- Second config-cache build: `${{ steps.build2.outputs.ms || 'NA' }} ms`'
            echo '- Config-cache reuse result: `${{ steps.build2.outcome }}`'
          } >> "$GITHUB_STEP_SUMMARY"
