name: SWRLZ CI Tooling Validation

on:
  pull_request:
    paths:
      - 'swrlz-core/tools/ci/**'
      - '.github/workflows/swrlz-apk-router.yml'
      - '.github/workflows/source-package-integrity.yml'
      - '.github/workflows/patch-note-accounting.yml'
      - '.github/workflows/swrlz-ci-tooling-validation.yml'
  push:
    branches:
      - main
    paths:
      - 'swrlz-core/tools/ci/**'
      - '.github/workflows/swrlz-apk-router.yml'
      - '.github/workflows/source-package-integrity.yml'
      - '.github/workflows/patch-note-accounting.yml'
      - '.github/workflows/swrlz-ci-tooling-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  validate-ci-tooling:
    name: Validate resolver, audits, actions, and build helper
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Sparse checkout CI tooling
        uses: actions/checkout@v6
        with:
          fetch-depth: 2
          filter: blob:none
          sparse-checkout: |
            swrlz-core/tools/ci
            swrlz-core/requests

      - name: Validate Python and shell syntax
        working-directory: swrlz-core/tools/ci
        run: |
          set -euo pipefail
          python3 -m py_compile \
            resolve_swrlz_source.py \
            resolve_changed_source_identities.py \
            resolve_push_changed_paths.py \
            plan_swrlz_build_route.py \
            prepare_swrlz_sparse_checkout.py \
            verify_swrlz_package_pair.py \
            verify_patch_note_accounting.py \
            test_resolve_swrlz_source.py \
            test_resolve_changed_source_identities.py \
            test_resolve_push_changed_paths.py \
            test_plan_swrlz_build_route.py \
            test_prepare_swrlz_sparse_checkout.py \
            test_verify_swrlz_package_pair.py \
            test_verify_patch_note_accounting.py
          bash -n build_swrlz_component.sh

      - name: Run CI tooling unit tests
        working-directory: swrlz-core/tools/ci
        run: |
          set -euo pipefail
          python3 test_resolve_swrlz_source.py
          python3 test_resolve_changed_source_identities.py
          python3 test_resolve_push_changed_paths.py
          python3 test_plan_swrlz_build_route.py
          python3 test_prepare_swrlz_sparse_checkout.py
          python3 test_verify_swrlz_package_pair.py
          python3 test_verify_patch_note_accounting.py

      - name: Smoke test Java 17 action
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          check-latest: false

      - name: Smoke test Gradle wrapper cache action
        uses: gradle/actions/setup-gradle@v5

      - name: Smoke test Android SDK action
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Verify toolchain availability
        run: |
          set -euo pipefail
          java -version
          sdkmanager --version
          command -v keytool

      - name: Create action round-trip fixture
        run: |
          printf 'SWRLZ Phase 4 action stack OK\n' > "$RUNNER_TEMP/swrlz-action-smoke.txt"

      - name: Smoke test artifact upload
        uses: actions/upload-artifact@v7
        with:
          name: swrlz-phase4-action-smoke-${{ github.run_id }}
          path: ${{ runner.temp }}/swrlz-action-smoke.txt
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Smoke test artifact download
        uses: actions/download-artifact@v8
        with:
          name: swrlz-phase4-action-smoke-${{ github.run_id }}
          path: ${{ runner.temp }}/swrlz-action-smoke-download

      - name: Verify artifact round trip
        run: |
          set -euo pipefail
          cmp \
            "$RUNNER_TEMP/swrlz-action-smoke.txt" \
            "$RUNNER_TEMP/swrlz-action-smoke-download/swrlz-action-smoke.txt"
