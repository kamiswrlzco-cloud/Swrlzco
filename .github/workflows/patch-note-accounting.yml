name: SWRLZ Patch Note Accounting

on:
  push:
    branches: [main]
    paths:
      - 'swrlz-core/sources/client/**'
      - 'swrlz-core/sources/server/**'
      - 'swrlz-core/docs/patch-notes/**'
      - 'swrlz-core/docs/reference/CURRENT_CANDIDATE_LINEAGE.md'
      - 'swrlz-core/docs/CURRENT_AUTHORITY.md'
      - 'swrlz-core/docs/contracts/SWRLZ_PATCH_NOTE_AND_LINEAGE_ACCOUNTING_V1.md'
      - 'swrlz-core/tools/ci/resolve_changed_source_identities.py'
      - 'swrlz-core/tools/ci/resolve_push_changed_paths.py'
      - 'swrlz-core/tools/ci/plan_swrlz_build_route.py'
      - 'swrlz-core/tools/ci/prepare_swrlz_sparse_checkout.py'
      - 'swrlz-core/tools/ci/verify_patch_note_accounting.py'
      - '.github/workflows/patch-note-accounting.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  SWRLZ_CI_ROOT: swrlz-core/tools/ci

defaults:
  run:
    shell: bash

jobs:
  prepare:
    name: Determine accounting route
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.checkout-plan.outputs.matrix }}
      has_source_work: ${{ steps.route.outputs.has_work }}
    steps:
      - name: Sparse checkout route tooling
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 2
          filter: blob:none
          sparse-checkout: |
            swrlz-core/tools/ci
            swrlz-core/requests

      - name: Plan changed source identities
        id: route
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == 'workflow_dispatch' ]]; then
            echo 'matrix={"include":[{"component":"CLIENT","source_identity":""}]}' >> "$GITHUB_OUTPUT"
            echo 'has_work=false' >> "$GITHUB_OUTPUT"
            echo 'build_variant=debug' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 "$SWRLZ_CI_ROOT/plan_swrlz_build_route.py"

      - name: Plan accounting candidate hydration
        id: checkout-plan
        env:
          ROUTE_MATRIX: ${{ steps.route.outputs.matrix }}
        run: |
          set -euo pipefail
          python3 "$SWRLZ_CI_ROOT/plan_swrlz_candidate_checkout.py" \
            --matrix-json "$ROUTE_MATRIX" \
            --ref "$GITHUB_SHA" \
            --github-output "$GITHUB_OUTPUT"

  audit-targeted:
    name: Audit ${{ matrix.component }} patch accounting
    needs: prepare
    if: needs.prepare.outputs.has_source_work == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    continue-on-error: true

    steps:
      - name: Hydrate accounting evidence · ${{ matrix.source_size_label }}
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: ${{ matrix.accounting_checkout_patterns }}

      - name: Audit selected package and repository accounting
        env:
          COMPONENT: ${{ matrix.component }}
          SOURCE_IDENTITY: ${{ matrix.source_identity }}
        run: |
          set -uo pipefail
          identities="$RUNNER_TEMP/swrlz-patch-accounting-identities.tsv"
          result="$RUNNER_TEMP/swrlz-patch-accounting.json"
          printf '%s\t%s\n' "$COMPONENT" "$SOURCE_IDENTITY" > "$identities"
          rc=0
          python3 "$SWRLZ_CI_ROOT/verify_patch_note_accounting.py" \
            --repo-root . \
            --identity-file "$identities" \
            --json-output "$result" || rc=$?
          if [[ ! -s "$result" ]]; then
            printf '{"schema":1,"status":"WARN","blocking":false,"exit_code":%d}\n' "$rc" > "$result"
          fi
          if [[ "$rc" -ne 0 ]]; then
            echo "::warning::Patch-note accounting diagnostic failed with exit $rc; source/build authority is unaffected."
          fi
          {
            echo "## $COMPONENT patch note accounting (diagnostic only)"
            echo
            echo '```json'
            cat "$result"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  audit-fallback:
    name: Audit current CLIENT / SERVER accounting
    needs: prepare
    if: needs.prepare.outputs.has_source_work != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    continue-on-error: true

    steps:
      - name: Checkout repository for current-candidate fallback audit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 2
          filter: blob:none
          sparse-checkout: |
            swrlz-core/tools/ci
            swrlz-core/sources/client
            swrlz-core/sources/server
            swrlz-core/docs

      - name: Audit current repository accounting
        run: |
          set -uo pipefail
          identities="$RUNNER_TEMP/swrlz-patch-accounting-identities.tsv"
          result="$RUNNER_TEMP/swrlz-patch-accounting.json"
          : > "$identities"
          rc=0
          python3 "$SWRLZ_CI_ROOT/verify_patch_note_accounting.py" \
            --repo-root . \
            --identity-file "$identities" \
            --json-output "$result" || rc=$?
          if [[ ! -s "$result" ]]; then
            printf '{"schema":1,"status":"WARN","blocking":false,"exit_code":%d}\n' "$rc" > "$result"
          fi
          if [[ "$rc" -ne 0 ]]; then
            echo "::warning::Current-candidate accounting diagnostic failed with exit $rc; source/build authority is unaffected."
          fi
          {
            echo '## SWRLZ Patch Note Accounting (diagnostic only)'
            echo
            echo '```json'
            cat "$result"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
