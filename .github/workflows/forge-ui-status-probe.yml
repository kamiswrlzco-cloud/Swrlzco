name: Forge UI Status Probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact SERVER R153 payload
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/forge-ui-status-probe.yml
            /swrlz-core/sources/server/.transport/SERVER_CFv2.1.27_SWRLZ_CANDIDATE_R153/SERVER_CFv2.1.27_SWRLZ_CANDIDATE_R153.zip.part0001
            /swrlz-core/sources/server/.transport/SERVER_CFv2.1.27_SWRLZ_CANDIDATE_R153/SERVER_CFv2.1.27_SWRLZ_CANDIDATE_R153.zip.part0002
            /swrlz-core/sources/server/.transport/SERVER_CFv2.1.27_SWRLZ_CANDIDATE_R153/SERVER_CFv2.1.27_SWRLZ_CANDIDATE_R153.zip.part0003
            /swrlz-core/sources/server/.transport/SERVER_CFv2.1.27_SWRLZ_CANDIDATE_R153/SERVER_CFv2.1.27_SWRLZ_CANDIDATE_R153.zip.part0004
            /swrlz-core/sources/server/SERVER_CFv2.1.27_SWRLZ_CANDIDATE_R153.transport.json
      - name: Reconstruct and verify SERVER R153
        shell: bash
        run: |
          set -euo pipefail
          ROOT='swrlz-core/sources/server/.transport/SERVER_CFv2.1.27_SWRLZ_CANDIDATE_R153'
          cat "$ROOT"/SERVER_CFv2.1.27_SWRLZ_CANDIDATE_R153.zip.part000{1,2,3,4} > "$RUNNER_TEMP/server-r153.zip"
          echo '6f3b31b9878b0e1ac2731d39de5cca3fc0402284ca5578bfd76704f6723318a5  '"$RUNNER_TEMP/server-r153.zip" | sha256sum -c -
      - name: Extract exact successor controls
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import zipfile

          src = Path('${{ runner.temp }}') / 'server-r153.zip'
          out = Path('${{ runner.temp }}') / 'successor-controls'
          out.mkdir(parents=True, exist_ok=True)
          wanted_names = {
              'REVISION.txt', 'VERSION_CHECKPOINT.md', 'PATCH_ACCOUNTING.json',
              'LINEAGE.json', 'SOURCE_MANIFEST.sha256', 'app/build.gradle.kts',
              'AppBuildMetadata.kt', 'BuildInfo.kt', 'BuildWatermark.kt',
              'VersionCheckpointTest.kt', 'BuildWatermarkTest.kt',
          }
          selected = []
          r153_hits = []
          with zipfile.ZipFile(src) as z:
              names = [i.filename for i in z.infolist() if not i.is_dir()]
              (out / 'ZIP_LISTING.txt').write_text('\n'.join(names) + '\n', encoding='utf-8')
              for info in z.infolist():
                  if info.is_dir():
                      continue
                  p = PurePosixPath(info.filename)
                  rel = '/'.join(p.parts[1:]) if len(p.parts) > 1 else p.name
                  base = p.name
                  low = info.filename.lower()
                  exact = base in wanted_names or rel == 'app/build.gradle.kts'
                  update_doc = (
                      ('r153' in low or 'cfv276' in low or 'patch_account' in low or 'lineage' in low)
                      and info.file_size <= 1024 * 1024
                      and low.endswith(('.kt','.kts','.json','.md','.txt','.properties','.sha256'))
                  )
                  if exact or update_doc:
                      selected.append(info.filename)
                      target = out / info.filename
                      target.parent.mkdir(parents=True, exist_ok=True)
                      target.write_bytes(z.read(info))
                  if ('r153' in low or '276' in low) and info.file_size <= 1024 * 1024:
                      r153_hits.append(info.filename)
          (out / 'R153_FILENAME_HITS.txt').write_text('\n'.join(sorted(r153_hits)) + '\n', encoding='utf-8')
          print(f'archive files={len(names)} selected={len(selected)}')
          for name in sorted(selected):
              print(name)
          PY
      - name: Show exact control summary
        shell: bash
        run: |
          set -euo pipefail
          grep -RniE -C 3 'R153|276|versionCode|versionName|SWRLZ_REVISION|SWRLZ_PATCH_ID|parent|revision|lineage|accounting' "$RUNNER_TEMP/successor-controls" \
            --include='*.kt' --include='*.kts' --include='*.json' --include='*.md' --include='*.txt' --include='*.properties' | head -n 2400 || true
      - name: Upload exact successor controls
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: forge-ui-r153-successor-controls
          path: ${{ runner.temp }}/successor-controls
          if-no-files-found: error
          retention-days: 1
          compression-level: 6
