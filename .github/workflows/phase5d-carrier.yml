name: SWRLZ Phase 5D Carrier Validation

on:
  push:
    branches:
      - checkpoint/forge-phase5d-workflow-hardening-20260821
    paths:
      - '.github/workflows/phase5d-carrier.yml'
      - 'swrlz-core/tools/ci/phase5d_prepare.py'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/phase5d-carrier.yml'
      - 'swrlz-core/tools/ci/phase5d_prepare.py'
      - '.github/workflows/source-package-integrity.yml'

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  prepare-validate-carrier:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: checkpoint/forge-phase5d-workflow-hardening-20260821
          fetch-depth: 3
          filter: blob:none
          persist-credentials: false
          sparse-checkout: |
            .github/workflows
            swrlz-core/tools/ci
            swrlz-core/requests
            swrlz-core/history

      - name: Align timing transformer with two payloads
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('swrlz-core/tools/ci/phase5d_prepare.py')
          text = path.read_text(encoding='utf-8')
          old = '''replace_once(
              helper,
              """    \\"source_hydration_ms\\": int(os.environ[\\"SOURCE_HYDRATION_MS\\"]),\\n    \\"gradle_setup_ms\\": int(os.environ[\\"GRADLE_SETUP_MS\\"]),\\n""",
              """    \\"source_hydration_ms\\": int(os.environ[\\"SOURCE_HYDRATION_MS\\"]),\\n    \\"java_setup_ms\\": int(os.environ[\\"JAVA_SETUP_MS\\"]),\\n    \\"gradle_setup_ms\\": int(os.environ[\\"GRADLE_SETUP_MS\\"]),\\n""",
              'helper timing JSON Java field',
          )
          '''
          new = '''text = helper.read_text(encoding='utf-8')
          old = '    "source_hydration_ms": int(os.environ["SOURCE_HYDRATION_MS"]),\\n    "gradle_setup_ms": int(os.environ["GRADLE_SETUP_MS"]),\\n'
          new = '    "source_hydration_ms": int(os.environ["SOURCE_HYDRATION_MS"]),\\n    "java_setup_ms": int(os.environ["JAVA_SETUP_MS"]),\\n    "gradle_setup_ms": int(os.environ["GRADLE_SETUP_MS"]),\\n'
          if text.count(old) != 2:
              raise SystemExit(f'helper timing JSON Java fields: expected two markers, found {text.count(old)}')
          helper.write_text(text.replace(old, new, 2), encoding='utf-8')
          '''
          obsolete = '''# The failure payload uses the same setup-field sequence as the primary timing payload.
          text = helper.read_text(encoding='utf-8')
          old = '    "source_hydration_ms": int(os.environ["SOURCE_HYDRATION_MS"]),\\n    "gradle_setup_ms": int(os.environ["GRADLE_SETUP_MS"]),\\n'
          new = '    "source_hydration_ms": int(os.environ["SOURCE_HYDRATION_MS"]),\\n    "java_setup_ms": int(os.environ["JAVA_SETUP_MS"]),\\n    "gradle_setup_ms": int(os.environ["GRADLE_SETUP_MS"]),\\n'
          if text.count(old) != 1:
              raise SystemExit(f'helper failure JSON Java field: expected one remaining marker, found {text.count(old)}')
          helper.write_text(text.replace(old, new, 1), encoding='utf-8')
          '''
          if text.count(old) != 1:
              raise SystemExit(f'transformer timing marker count was {text.count(old)}')
          text = text.replace(old, new, 1)
          if text.count(obsolete) != 1:
              raise SystemExit(f'obsolete failure timing pass count was {text.count(obsolete)}')
          path.write_text(text.replace(obsolete, '', 1), encoding='utf-8')
          PY

      - name: Apply Phase 5D transformation in workspace
        run: |
          set -euo pipefail
          python3 -m py_compile swrlz-core/tools/ci/phase5d_prepare.py
          python3 swrlz-core/tools/ci/phase5d_prepare.py

      - name: Align integrity contract with auth-only Phase 5D change
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('swrlz-core/tools/ci/test_workflow_phase5_contract.py')
          text = path.read_text(encoding='utf-8')
          for line in (
              "        self.assertIn(\"- 'swrlz-core/tools/ci/plan_swrlz_candidate_checkout.py'\", integrity)\n",
              "        self.assertIn(\"- 'swrlz-core/tools/ci/verify_swrlz_package_pair.py'\", integrity)\n",
          ):
              if text.count(line) != 1:
                  raise SystemExit(f'integrity staging assertion marker count was {text.count(line)}')
              text = text.replace(line, '', 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate transformed tooling
        working-directory: swrlz-core/tools/ci
        run: |
          set -euo pipefail
          python3 -m py_compile \
            test_build_swrlz_component.py \
            test_workflow_phase5_contract.py
          bash -n build_swrlz_component.sh
          python3 test_build_swrlz_component.py
          python3 test_workflow_phase5_contract.py

      - name: Validate workflow syntax invariants
        run: |
          set -euo pipefail
          git diff --check
          ! grep -q 'actions/setup-java@' .github/workflows/swrlz-apk-router.yml
          ! grep -q 'actions/setup-java@' .github/workflows/swrlz-ci-tooling-validation.yml
          grep -q 'Validate preinstalled Java 17' .github/workflows/swrlz-apk-router.yml
          grep -q 'for attempt in 1 2 3; do' .github/workflows/swrlz-apk-router.yml
          [[ "$(grep -c 'persist-credentials: false' .github/workflows/source-package-integrity.yml)" -ge 2 ]]

      - name: Prepare validated production export
        run: |
          set -euo pipefail
          CARRIER="$RUNNER_TEMP/phase5d-carrier"
          rm -rf "$CARRIER"
          mkdir -p "$CARRIER"
          cp .github/workflows/swrlz-apk-router.yml "$CARRIER/swrlz-apk-router.yml.txt"
          cp .github/workflows/swrlz-ci-tooling-validation.yml "$CARRIER/swrlz-ci-tooling-validation.yml.txt"
          cp swrlz-core/tools/ci/build_swrlz_component.sh "$CARRIER/build_swrlz_component.sh.txt"
          cp swrlz-core/tools/ci/test_build_swrlz_component.py "$CARRIER/test_build_swrlz_component.py.txt"
          cp swrlz-core/tools/ci/test_workflow_phase5_contract.py "$CARRIER/test_workflow_phase5_contract.py.txt"
          sha256sum "$CARRIER"/* > "$CARRIER/SHA256SUMS.txt"

      - name: Upload validated Phase 5D export
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: phase5d-validated-production-${{ github.run_id }}
          path: ${{ runner.temp }}/phase5d-carrier/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
