name: SWRLZ Java 17 Hotpath Benchmark

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/swrlz-java17-hotpath-benchmark.yml'

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  benchmark:
    name: ${{ matrix.component }} · Java ${{ matrix.java_mode }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: CLIENT
            java_mode: action
            source_identity: swrlz-core/sources/client/CLIENT_CFv2.1.27_SWRLZ_CANDIDATE_R114.transport.json
            checkout_patterns: |
              swrlz-core/tools/ci
              swrlz-core/sources/client/CLIENT_CFv2.1.27_SWRLZ_CANDIDATE_R114.transport.json
              swrlz-core/sources/client/CLIENT_CFv2.1.27_SWRLZ_CANDIDATE_R114_METADATA.zip
              swrlz-core/sources/client/.transport/CLIENT_CFv2.1.27_SWRLZ_CANDIDATE_R114/CLIENT_CFv2.1.27_SWRLZ_CANDIDATE_R114.zip.part0001
              swrlz-core/sources/client/.transport/CLIENT_CFv2.1.27_SWRLZ_CANDIDATE_R114/CLIENT_CFv2.1.27_SWRLZ_CANDIDATE_R114.zip.part0002
          - component: CLIENT
            java_mode: preinstalled
            source_identity: swrlz-core/sources/client/CLIENT_CFv2.1.27_SWRLZ_CANDIDATE_R114.transport.json
            checkout_patterns: |
              swrlz-core/tools/ci
              swrlz-core/sources/client/CLIENT_CFv2.1.27_SWRLZ_CANDIDATE_R114.transport.json
              swrlz-core/sources/client/CLIENT_CFv2.1.27_SWRLZ_CANDIDATE_R114_METADATA.zip
              swrlz-core/sources/client/.transport/CLIENT_CFv2.1.27_SWRLZ_CANDIDATE_R114/CLIENT_CFv2.1.27_SWRLZ_CANDIDATE_R114.zip.part0001
              swrlz-core/sources/client/.transport/CLIENT_CFv2.1.27_SWRLZ_CANDIDATE_R114/CLIENT_CFv2.1.27_SWRLZ_CANDIDATE_R114.zip.part0002
          - component: SERVER
            java_mode: action
            source_identity: swrlz-core/sources/server/SERVER_CFv2.1.27_SWRLZ_CANDIDATE_R152.transport.json
            checkout_patterns: |
              swrlz-core/tools/ci
              swrlz-core/sources/server/SERVER_CFv2.1.27_SWRLZ_CANDIDATE_R152.transport.json
              swrlz-core/sources/server/SERVER_CFv2.1.27_SWRLZ_CANDIDATE_R152_METADATA.zip
              swrlz-core/sources/server/.transport/SERVER_CFv2.1.27_SWRLZ_CANDIDATE_R152/SERVER_CFv2.1.27_SWRLZ_CANDIDATE_R152.zip.part0001
              swrlz-core/sources/server/.transport/SERVER_CFv2.1.27_SWRLZ_CANDIDATE_R152/SERVER_CFv2.1.27_SWRLZ_CANDIDATE_R152.zip.part0002
              swrlz-core/sources/server/.transport/SERVER_CFv2.1.27_SWRLZ_CANDIDATE_R152/SERVER_CFv2.1.27_SWRLZ_CANDIDATE_R152.zip.part0003
              swrlz-core/sources/server/.transport/SERVER_CFv2.1.27_SWRLZ_CANDIDATE_R152/SERVER_CFv2.1.27_SWRLZ_CANDIDATE_R152.zip.part0004
          - component: SERVER
            java_mode: preinstalled
            source_identity: swrlz-core/sources/server/SERVER_CFv2.1.27_SWRLZ_CANDIDATE_R152.transport.json
            checkout_patterns: |
              swrlz-core/tools/ci
              swrlz-core/sources/server/SERVER_CFv2.1.27_SWRLZ_CANDIDATE_R152.transport.json
              swrlz-core/sources/server/SERVER_CFv2.1.27_SWRLZ_CANDIDATE_R152_METADATA.zip
              swrlz-core/sources/server/.transport/SERVER_CFv2.1.27_SWRLZ_CANDIDATE_R152/SERVER_CFv2.1.27_SWRLZ_CANDIDATE_R152.zip.part0001
              swrlz-core/sources/server/.transport/SERVER_CFv2.1.27_SWRLZ_CANDIDATE_R152/SERVER_CFv2.1.27_SWRLZ_CANDIDATE_R152.zip.part0002
              swrlz-core/sources/server/.transport/SERVER_CFv2.1.27_SWRLZ_CANDIDATE_R152/SERVER_CFv2.1.27_SWRLZ_CANDIDATE_R152.zip.part0003
              swrlz-core/sources/server/.transport/SERVER_CFv2.1.27_SWRLZ_CANDIDATE_R152/SERVER_CFv2.1.27_SWRLZ_CANDIDATE_R152.zip.part0004

    steps:
      - name: Start exact source hydration timer
        run: echo "BENCH_HYDRATION_STARTED_MS=$(date +%s%3N)" >> "$GITHUB_ENV"

      - name: Hydrate exact ${{ matrix.component }} candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: ${{ matrix.checkout_patterns }}

      - name: Record source hydration timing
        id: hydration
        run: |
          set -euo pipefail
          end_ms="$(date +%s%3N)"
          elapsed=$((end_ms - BENCH_HYDRATION_STARTED_MS))
          echo "ms=$elapsed" >> "$GITHUB_OUTPUT"

      - name: Resolve and verify exact source
        id: source
        env:
          COMPONENT: ${{ matrix.component }}
          SOURCE_IDENTITY: ${{ matrix.source_identity }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/source"
          python3 swrlz-core/tools/ci/resolve_swrlz_source.py \
            --component "$COMPONENT" \
            --source-zip "$SOURCE_IDENTITY" \
            --work-dir "$RUNNER_TEMP/source/$COMPONENT" \
            --github-output "$GITHUB_OUTPUT"
          args=("${{ steps.source.outputs.selected_source }}")
          if [[ -n "${{ steps.source.outputs.checksum_file }}" ]]; then
            args+=(--checksum "${{ steps.source.outputs.checksum_file }}")
          fi
          if [[ -n "${{ steps.source.outputs.manifest_file }}" ]]; then
            args+=(--manifest "${{ steps.source.outputs.manifest_file }}")
          fi
          python3 swrlz-core/tools/ci/verify_swrlz_package_pair.py "${args[@]}"

      - name: Start Java timer
        run: echo "BENCH_JAVA_STARTED_MS=$(date +%s%3N)" >> "$GITHUB_ENV"

      - name: Set up Java 17 action path
        if: matrix.java_mode == 'action'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
          check-latest: false

      - name: Select preinstalled Java 17 path
        if: matrix.java_mode == 'preinstalled'
        run: |
          set -euo pipefail
          JDK_DIR="${JAVA_HOME_17_X64:-}"
          [[ -n "$JDK_DIR" && -x "$JDK_DIR/bin/java" && -x "$JDK_DIR/bin/javac" && -x "$JDK_DIR/bin/keytool" ]]
          spec="$($JDK_DIR/bin/java -XshowSettings:properties -version 2>&1 | awk -F'= ' '/java.specification.version/{print $2; exit}')"
          [[ "$spec" == '17' ]]
          echo "JAVA_HOME=$JDK_DIR" >> "$GITHUB_ENV"
          echo "$JDK_DIR/bin" >> "$GITHUB_PATH"

      - name: Validate Java and record timing
        id: java
        run: |
          set -euo pipefail
          command -v java >/dev/null
          command -v javac >/dev/null
          command -v keytool >/dev/null
          spec="$(java -XshowSettings:properties -version 2>&1 | awk -F'= ' '/java.specification.version/{print $2; exit}')"
          [[ "$spec" == '17' ]]
          end_ms="$(date +%s%3N)"
          elapsed=$((end_ms - BENCH_JAVA_STARTED_MS))
          echo "ms=$elapsed" >> "$GITHUB_OUTPUT"
          echo "home=${JAVA_HOME:-}" >> "$GITHUB_OUTPUT"

      - name: Start Gradle setup timer
        run: echo "BENCH_GRADLE_SETUP_STARTED_MS=$(date +%s%3N)" >> "$GITHUB_ENV"

      - name: Set up Gradle wrapper cache
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-cleanup: on-success

      - name: Record Gradle setup timing
        id: gradle_setup
        run: |
          set -euo pipefail
          end_ms="$(date +%s%3N)"
          elapsed=$((end_ms - BENCH_GRADLE_SETUP_STARTED_MS))
          echo "ms=$elapsed" >> "$GITHUB_OUTPUT"

      - name: Validate pinned-runner Android SDK fast path
        id: android
        run: |
          set -euo pipefail
          started="$(date +%s%3N)"
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          [[ -n "$SDK_DIR" && -d "$SDK_DIR" ]]
          apksigner="$(find "$SDK_DIR/build-tools" -mindepth 2 -maxdepth 2 -type f -name apksigner -print 2>/dev/null | sort -V | tail -n 1)"
          zipalign="$(find "$SDK_DIR/build-tools" -mindepth 2 -maxdepth 2 -type f -name zipalign -print 2>/dev/null | sort -V | tail -n 1)"
          [[ -x "$apksigner" && -x "$zipalign" ]]
          elapsed=$(($(date +%s%3N) - started))
          echo "ms=$elapsed" >> "$GITHUB_OUTPUT"

      - name: Build exact ${{ matrix.component }} debug APK
        id: build
        env:
          SWRLZ_VERIFIED_SOURCE_SHA256: ${{ steps.source.outputs.source_sha256 }}
          SWRLZ_SOURCE_HYDRATION_MS: ${{ steps.hydration.outputs.ms }}
          SWRLZ_GRADLE_SETUP_MS: ${{ steps.gradle_setup.outputs.ms }}
          SWRLZ_ANDROID_SDK_SETUP_MS: ${{ steps.android.outputs.ms }}
        run: |
          set -euo pipefail
          bash swrlz-core/tools/ci/build_swrlz_component.sh \
            "${{ matrix.component }}" \
            "${{ steps.source.outputs.selected_source }}" \
            "${{ steps.source.outputs.canonical_stem }}" \
            debug \
            "$RUNNER_TEMP/build/${{ matrix.component }}-${{ matrix.java_mode }}" \
            "$RUNNER_TEMP/artifacts/${{ matrix.component }}-${{ matrix.java_mode }}"

      - name: Publish benchmark summary
        if: always()
        env:
          COMPONENT: ${{ matrix.component }}
          JAVA_MODE: ${{ matrix.java_mode }}
          HYDRATION_MS: ${{ steps.hydration.outputs.ms }}
          JAVA_MS: ${{ steps.java.outputs.ms }}
          JAVA_HOME_SELECTED: ${{ steps.java.outputs.home }}
          GRADLE_SETUP_MS: ${{ steps.gradle_setup.outputs.ms }}
          ANDROID_MS: ${{ steps.android.outputs.ms }}
          EXTRACT_MS: ${{ steps.build.outputs.extract_ms }}
          GRADLE_MS: ${{ steps.build.outputs.gradle_ms }}
          HELPER_MS: ${{ steps.build.outputs.build_helper_total_ms }}
        run: |
          {
            echo "## SWRLZ Java 17 hotpath benchmark"
            echo
            echo "- Component: $COMPONENT"
            echo "- Java mode: $JAVA_MODE"
            echo "- Source hydration: ${HYDRATION_MS:-NA} ms"
            echo "- Java setup: ${JAVA_MS:-NA} ms"
            echo "- JAVA_HOME: ${JAVA_HOME_SELECTED:-NA}"
            echo "- Gradle cache setup: ${GRADLE_SETUP_MS:-NA} ms"
            echo "- Android SDK preflight: ${ANDROID_MS:-NA} ms"
            echo "- Source extraction: ${EXTRACT_MS:-NA} ms"
            echo "- Gradle compile: ${GRADLE_MS:-NA} ms"
            echo "- Build helper total: ${HELPER_MS:-NA} ms"
          } >> "$GITHUB_STEP_SUMMARY"
