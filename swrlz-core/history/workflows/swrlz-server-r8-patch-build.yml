name: SWRLZ SERVER R8 — Verified Derived Source Build

on:
  push:
    branches:
      - main
    paths:
      - 'swrlz-core/requests/INT_FIX_064F_SERVER_R8.request'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swrlz-server-r8-derived-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build-server-r8:
    name: Build SERVER CFv2.1.26 R8 APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI_ROOT: swrlz-core/tools/ci
      PATCH_ROOT: swrlz-core/source-patches/server/SERVER_CFv2.1.26_SWRLZ_CANDIDATE_R8
      BASE_IDENTITY: swrlz-core/sources/server/SERVER_CFv2.1.26_SWRLZ_CANDIDATE_R7.transport.json
      OUTPUT_NAME: SERVER_CFv2.1.26_SWRLZ_CANDIDATE_R8.zip
      OUTPUT_STEM: SERVER_CFv2.1.26_SWRLZ_CANDIDATE_R8
      EXPECTED_SHA256: b190c0c07fa8ed6073c983a4b6fdb6efff3f23ce9d3b0410e64151e7b3986099
      EXPECTED_SIZE: '40801070'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate bounded R8 build request
        run: |
          set -euo pipefail
          REQUEST=swrlz-core/requests/INT_FIX_064F_SERVER_R8.request
          grep -Fx 'enabled=true' "$REQUEST"
          grep -Fx 'target=SERVER' "$REQUEST"
          grep -Fx 'candidate=SERVER_CFv2.1.26_SWRLZ_CANDIDATE_R8' "$REQUEST"
          grep -Fx "source_sha256=$EXPECTED_SHA256" "$REQUEST"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Run resolver and package-verifier regression tests
        working-directory: swrlz-core/tools/ci
        run: |
          set -euo pipefail
          python3 test_resolve_swrlz_source.py
          python3 test_resolve_changed_source_identities.py
          python3 test_verify_swrlz_package_pair.py

      - name: Resolve verified SERVER R7 base source
        id: base
        run: |
          set -euo pipefail
          python3 "$CI_ROOT/resolve_swrlz_source.py" \
            --component SERVER \
            --source-zip "$BASE_IDENTITY" \
            --work-dir "$RUNNER_TEMP/swrlz-r8/base" \
            --github-output "$GITHUB_OUTPUT"

      - name: Materialize byte-exact SERVER R8 source
        id: source
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/swrlz-r8/output"
          python3 "$CI_ROOT/apply_swrlz_archive_patch.py" \
            "${{ steps.base.outputs.selected_source }}" \
            "$PATCH_ROOT/$OUTPUT_STEM.patch.json" \
            "$RUNNER_TEMP/swrlz-r8/output/$OUTPUT_NAME" \
            --github-output "$GITHUB_OUTPUT"

      - name: Verify R8 source package and namespace repair
        run: |
          set -euo pipefail
          SOURCE="${{ steps.source.outputs.source }}"
          test "$(sha256sum "$SOURCE" | awk '{print $1}')" = "$EXPECTED_SHA256"
          test "$(stat -c%s "$SOURCE")" = "$EXPECTED_SIZE"
          python3 "$CI_ROOT/verify_swrlz_package_pair.py" "$SOURCE" \
            --checksum "$PATCH_ROOT/$OUTPUT_STEM.sha256" \
            --manifest "$PATCH_ROOT/$OUTPUT_STEM.manifest.json"
          python3 - "$SOURCE" <<'PY'
          import hashlib, sys, zipfile
          source=sys.argv[1]
          with zipfile.ZipFile(source) as archive:
              names=[n for n in archive.namelist() if not n.endswith('/')]
              roots={n.split('/',1)[0] for n in names}
              assert roots == {'SERVER_CFv2.1.26_SWRLZ_CANDIDATE_R8'}
              root=next(iter(roots))
              for file_name in ('ForgeAutomatedBuildRunner.kt','ForgeBuildMonitor.kt'):
                  path=f'{root}/app/src/main/java/sh/swrlz/nodehost/forge/{file_name}'
                  text=archive.read(path).decode('utf-8')
                  assert text.startswith('package sh.swrlz.nodehost.forge\n')
                  assert 'package sh.swurlz.nodehost.forge' not in text
              manifest=archive.read(f'{root}/SOURCE_MANIFEST.sha256').decode('utf-8').splitlines()
              assert len(manifest)==723
              for line in manifest:
                  digest, relative=line.split('  ',1)
                  actual=hashlib.sha256(archive.read(f'{root}/{relative}')).hexdigest()
                  assert digest==actual, relative
          print('SERVER R8 namespace and SOURCE_MANIFEST 723/723 verified')
          PY

      - name: Describe selected source and build
        run: |
          set -euo pipefail
          {
            echo '## SERVER CFv2.1.26 R8 source selected'
            echo
            echo '- Component: `SERVER`'
            echo '- Candidate: `SERVER_CFv2.1.26_SWRLZ_CANDIDATE_R8`'
            echo '- Version code: `91`'
            echo '- Build variant: `debug`'
            echo '- Source SHA-256: `b190c0c07fa8ed6073c983a4b6fdb6efff3f23ce9d3b0410e64151e7b3986099`'
            echo '- Source size: `40801070 bytes`'
            echo '- Base lineage: `SERVER R7` / `3feb9ceeb4afe925cc17c33bd51368bebe7c171ab4f441b41ad2df7bdec88caf`'
            echo '- Repair: correct `sh.swurlz.nodehost.forge` to `sh.swrlz.nodehost.forge` in the automated runner and build monitor.'
            echo '- Package mode: deterministic derived source patch with byte-exact output verification.'
          } | tee "$RUNNER_TEMP/SOURCE_BUILD_DESCRIPTION.txt" >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=SWRLZ SERVER source::Building SERVER CFv2.1.26 R8 VC91 from SHA-256 $EXPECTED_SHA256"

      - name: Build selected SERVER Android component
        id: build
        run: |
          set -euo pipefail
          bash "$CI_ROOT/build_swrlz_component.sh" \
            SERVER \
            "${{ steps.source.outputs.source }}" \
            "$OUTPUT_STEM" \
            debug \
            "$RUNNER_TEMP/swrlz-build/SERVER" \
            "$RUNNER_TEMP/swrlz-artifacts/SERVER"

      - name: Record R8 build provenance
        env:
          ARTIFACT_DIR: ${{ steps.build.outputs.artifact_dir }}
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/SOURCE_BUILD_DESCRIPTION.txt" "$ARTIFACT_DIR/SOURCE_BUILD_DESCRIPTION.txt"
          sha256sum "$ARTIFACT_DIR/SOURCE_BUILD_DESCRIPTION.txt" > "$ARTIFACT_DIR/SOURCE_BUILD_DESCRIPTION.txt.sha256"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          artifact=Path(os.environ['ARTIFACT_DIR'])
          payload={
            'schema': 1,
            'checkpoint': 'INT-FIX-064F-SERVER-R8',
            'component': 'SERVER',
            'candidate': 'SERVER_CFv2.1.26_SWRLZ_CANDIDATE_R8',
            'version': 'CFv2.1.26',
            'revision': 'R8',
            'versionCode': 91,
            'variant': 'debug',
            'sourceSha256': 'b190c0c07fa8ed6073c983a4b6fdb6efff3f23ce9d3b0410e64151e7b3986099',
            'sourceSizeBytes': 40801070,
            'baseSourceSha256': '3feb9ceeb4afe925cc17c33bd51368bebe7c171ab4f441b41ad2df7bdec88caf',
            'repositoryCommit': os.environ['GITHUB_SHA'],
            'workflowRun': os.environ['GITHUB_RUN_ID'],
          }
          (artifact/'SOURCE_RESOLUTION.json').write_text(json.dumps(payload,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          PY
          sha256sum "$ARTIFACT_DIR/SOURCE_RESOLUTION.json" > "$ARTIFACT_DIR/SOURCE_RESOLUTION.json.sha256"

      - name: Upload SERVER R8 APK and provenance artifact
        uses: actions/upload-artifact@v4
        with:
          name: SERVER_CFv2.1.26_SWRLZ_CANDIDATE_R8_debug_APK
          path: ${{ steps.build.outputs.artifact_dir }}/
          if-no-files-found: error
          retention-days: 30
